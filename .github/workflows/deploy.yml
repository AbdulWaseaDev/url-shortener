name: Deploy URL Shortener

# Pipeline: unit tests + build -> deploy staging -> integration tests on staging
#           -> deploy prod -> read-only smoke tests on prod.
# Prod is only deployed if staging passed its integration tests.

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.13'

permissions:
  id-token: write  # Required for OIDC authentication
  contents: read

# Never run two deployments at once
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Unit Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest boto3 requests
          pip install -r url_shortener/requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short
        env:
          TABLE_NAME: test-table
          AWS_DEFAULT_REGION: us-east-1

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM Build
        run: sam build --use-container

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: sam-build
          path: .aws-sam/build
          include-hidden-files: true

  staging:
    name: Deploy Staging and Run Integration Tests
    needs: build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install test dependencies
        run: pip install pytest boto3 requests

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: sam-build
          path: .aws-sam/build

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SAM Deploy (staging)
        run: |
          sam deploy \
            --config-env staging \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Read stack outputs
        id: outputs
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name url-shortener-staging \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          API_KEY=$(aws apigateway get-api-key \
            --api-key "$(get_output ApiKeyId)" \
            --include-value \
            --query value \
            --output text)
          echo "::add-mask::${API_KEY}"
          echo "API_KEY=${API_KEY}" >> $GITHUB_OUTPUT
          echo "API_ENDPOINT=$(get_output BaseUrl)" >> $GITHUB_OUTPUT
          echo "TABLE_NAME=$(get_output TableName)" >> $GITHUB_OUTPUT

      - name: Run integration tests (staging)
        run: pytest tests/integration/ -v --tb=short
        env:
          RUN_INTEGRATION_TESTS: true
          API_ENDPOINT: ${{ steps.outputs.outputs.API_ENDPOINT }}
          API_KEY: ${{ steps.outputs.outputs.API_KEY }}
          TABLE_NAME: ${{ steps.outputs.outputs.TABLE_NAME }}

  production:
    name: Deploy Production and Run Smoke Tests
    needs: staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install test dependencies
        run: pip install pytest requests

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: sam-build
          path: .aws-sam/build

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SAM Deploy (production)
        run: |
          sam deploy \
            --config-env prod \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Run smoke tests (production, read-only)
        run: pytest tests/smoke/ -v --tb=short
        env:
          SMOKE_API_ENDPOINT: https://url-shortener.berlintechs.com

      - name: Deployment Summary
        run: |
          echo "✅ Staging passed integration tests; production deployed and smoke-tested"
          echo "Production: https://url-shortener.berlintechs.com"
