[pytest]
# Pytest configuration for URL shortener tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test markers
markers =
    unit: Unit tests with mocked dependencies
    integration: Integration tests against real API (requires API_ENDPOINT)

# Paths
testpaths = tests

# Python path
pythonpath = url_shortener
