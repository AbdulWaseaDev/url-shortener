AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  URL Shortener - Production-ready serverless REST API for creating and managing short links

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment
  DomainName:
    Type: String
    Default: url-shortener.berlintechs.com
    Description: Custom domain for short links (DNS is managed in Cloudflare)
  CertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:633605692642:certificate/44fddf0a-dc3c-441f-a109-19002961ff39
    Description: ACM certificate for DomainName (must be in the stack's region)

Globals:
  Api:
    # Custom domain mapped at the root, so short links are https://<domain>/<code>
    Domain:
      DomainName: !Ref DomainName
      CertificateArn: !Ref CertificateArn
      EndpointConfiguration: REGIONAL
      BasePath:
        - /
    # Stage-wide throttle for every route, including the public redirect and stats routes
    MethodSettings:
      - ResourcePath: '/*'
        HttpMethod: '*'
        ThrottlingRateLimit: 50
        ThrottlingBurstLimit: 100
    # API key usage plan; only routes with ApiKeyRequired (POST /links) enforce it
    Auth:
      UsagePlan:
        CreateUsagePlan: PER_API
        Description: Limits link creation per API key
        Throttle:
          RateLimit: 5
          BurstLimit: 10
        Quota:
          Limit: 1000
          Period: DAY
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 256
    Tracing: Active  # AWS X-Ray tracing for observability
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment

Resources:
  # DynamoDB Table - stores short code -> original URL mappings
  # Uses on-demand billing (pay per request) - ideal for variable traffic
  LinksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'url-shortener-links-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: short_code
          AttributeType: S
      KeySchema:
        - AttributeName: short_code
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: url-shortener
        - Key: Environment
          Value: !Ref Environment

  # Lambda Function - handles all API routes (POST /links, GET /{code}, GET /links/{code}/stats)
  # SAM automatically creates an implicit API Gateway when Events don't specify RestApiId
  UrlShortenerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'url-shortener-api-${Environment}'
      CodeUri: url_shortener/
      Handler: app.lambda_handler
      Description: URL shortener API - create links, redirect, and track stats
      Environment:
        Variables:
          TABLE_NAME: !Ref LinksTable
      Policies:
        # Least privilege IAM - only the specific DynamoDB actions needed
        # GetItem: Read link data for redirects and stats
        # PutItem: Create new short links
        # UpdateItem: Atomically increment click counter
        - DynamoDBCrudPolicy:
            TableName: !Ref LinksTable
      Events:
        CreateLink:
          Type: Api
          Properties:
            Path: /links
            Method: POST
            Auth:
              ApiKeyRequired: true
        GetRedirect:
          Type: Api
          Properties:
            Path: /{code}
            Method: GET
        GetStats:
          Type: Api
          Properties:
            Path: /links/{code}/stats
            Method: GET
      LoggingConfig:
        LogGroup: !Ref FunctionLogGroup
      Tags:
        Application: url-shortener
        Environment: !Ref Environment

  # CloudWatch Log Group with 7-day retention
  # Automatically captures Lambda execution logs
  # Retention prevents indefinite log storage costs
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/url-shortener-api-${Environment}'
      RetentionInDays: 7

  # CloudWatch alarms - visible in the CloudWatch console (no notification targets)
  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'url-shortener-${Environment}-api-5xx'
      AlarmDescription: API returned 5 or more 5xx responses in 5 minutes
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Ref AWS::StackName
        - Name: Stage
          Value: Prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  FunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'url-shortener-${Environment}-lambda-errors'
      AlarmDescription: Lambda function invocation errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref UrlShortenerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  FunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'url-shortener-${Environment}-lambda-throttles'
      AlarmDescription: Lambda invocations are being throttled
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref UrlShortenerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  FunctionLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'url-shortener-${Environment}-lambda-latency'
      AlarmDescription: Lambda p99 duration above 3 seconds for 15 minutes
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref UrlShortenerFunction
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 3
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiEndpoint:
    Description: 'API Gateway endpoint URL for URL shortener'
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  CustomDomainUrl:
    Description: 'Public base URL for short links'
    Value: !Sub 'https://${DomainName}'

  ApiKeyId:
    Description: 'ID of the API key required by POST /links (get the value with aws apigateway get-api-key --include-value)'
    Value: !Ref ServerlessRestApiApiKey

  TableName:
    Description: 'DynamoDB table storing link mappings'
    Value: !Ref LinksTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'

  FunctionArn:
    Description: 'Lambda function ARN'
    Value: !GetAtt UrlShortenerFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FunctionArn'
